name: AWS S3 Static Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # BUILD STAGE
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        run: |
          node build.js
          test -f dist/index.html
          echo "Build completed successfully!"

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/

  # TEST STAGE
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/

      - name: Validate Website Files
        run: |
          test -s dist/index.html
          test -s dist/error.html
          test -s dist/style.css
          echo "Website test passed!"

  # DEPLOY STAGE
  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Website to S3
        run: |
          aws s3 sync dist/ s3://pro-ject-s3/ --delete

      - name: Deployment Completed
        run: |
          echo "Website successfully deployed to S3!"
